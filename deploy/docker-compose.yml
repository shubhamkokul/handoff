# Handoff, private phase: reachable only on the VPS at 127.0.0.1:7090
# (use an SSH tunnel). docker-compose.public.yml adds the Traefik route.
# Which files are active is set by COMPOSE_FILE in .env.
services:
  handoff:
    build:
      context: ./src
      dockerfile: ../Dockerfile
      args:
        NEXT_PUBLIC_FIREBASE_PROJECT_ID: ${NEXT_PUBLIC_FIREBASE_PROJECT_ID}
        NEXT_PUBLIC_FIREBASE_DATABASE_URL: ${NEXT_PUBLIC_FIREBASE_DATABASE_URL}
        NEXT_PUBLIC_FIREBASE_API_KEY: ${NEXT_PUBLIC_FIREBASE_API_KEY}
        NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: ${NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN}
    image: handoff:local
    restart: unless-stopped
    env_file: .env
    environment:
      # The key is mounted read-only from ./secrets; it never enters the image.
      GOOGLE_APPLICATION_CREDENTIALS: /run/secrets/service-account.json
    ports:
      - "127.0.0.1:7090:3000"
    volumes:
      - ./secrets/service-account.json:/run/secrets/service-account.json:ro
    read_only: true
    tmpfs:
      - /tmp
      - /app/.next/cache
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }
